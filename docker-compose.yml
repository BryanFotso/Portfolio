services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
